# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:
    branches: ["develop"]

jobs:
  verify:
    name: Verify (Lint, Test, Build)
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    strategy:
      matrix:
        node-version: ["lts/*"]

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: actions/checkout@v4
      - name: install dependencies
        run: npm ci
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build --if-present

  deploy:
    name: Release & Deploy to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: github-pages
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_AUTHOR: "Bruno Anhaia"
      CI_COMMIT_EMAIL: "32501648+brunoanhaia@users.noreply.github.com"

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install dependencies
        run: npm ci
      - name: config git & release
        run: |
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "${{ env.CI_COMMIT_EMAIL }}"
          git pull origin develop --rebase || true
          npm run release -- --release-as patch
          git push origin develop --follow-tags
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: build with production secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: npm run build --if-present
      - name: deploy gh pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: "${{ env.CI_COMMIT_AUTHOR }}"
          user_email: "${{ env.CI_COMMIT_EMAIL }}"
          full_commit_message: "deploy: v${{ env.RELEASE_VERSION }}"
